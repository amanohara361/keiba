name: 直前検算

on:
  schedule:
    # cron は UTC 指定。日本時間は +9 時間。土=6・日=0。
    #
    # **定時実行は大幅に遅れる。** 2026-08-08 に 11:00 JST 指定の便が
    # 12:25 JST に起動した（85分遅れ）。当初「5〜30分」と見積もっていたが
    # 実測はそれを大きく超える。14:30 指定のままだと 15:55 頃になり、
    # 15:25〜15:45 発走の重賞にはまったく間に合わない。
    #
    # 対策は2つ。
    #  (1) 十分に前倒しする。13:07 なら85分遅れても 14:32 に着く。
    #  (2) 毎時00分を避ける。GitHub 側が最も混む時刻なので待たされやすい。
    #
    # なお発走済みガードがあるため、遅れて起動しても発走後のレースは
    # 黙って除外される。早めに複数回まわしても害はない。
    # 確実に間に合わせたいときは Actions 画面から手動実行する
    # （workflow_dispatch は遅延しない）。
    - cron: '7 1 * * 6,0'   # 01:07 UTC = 10:07 JST  朝の買い目の到着確認
    - cron: '7 4 * * 6,0'   # 04:07 UTC = 13:07 JST  直前検算（本命）
    - cron: '7 5 * * 6,0'   # 05:07 UTC = 14:07 JST  直前検算（最終・オッズが最も締まる）
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 (YYYY-MM-DD)。空なら実行日。'
        required: false
      now:
        description: '現在時刻の上書き (YYYY-MM-DDTHH:MM)。動作確認用。'
        required: false
      no_email:
        description: 'メールを送らずログだけ出す'
        type: boolean
        default: false

concurrency:
  group: keiba-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 依存のインストールは不要（標準ライブラリだけで動く）。
      # インストール失敗で定刻を落とさないための設計でもある。

      - name: 検算を実行
        id: run
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_NOW: ${{ inputs.now }}
          INPUT_NO_EMAIL: ${{ inputs.no_email }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi
          if [ -n "$INPUT_NOW" ]; then
            args+=(--now "$INPUT_NOW")
          fi
          if [ "$INPUT_NO_EMAIL" = 'true' ]; then
            args+=(--no-email)
          fi
          # 終了コード3＝要確認の事象を検知して正常に通知できた状態。
          # 役目は果たしているのでジョブは成功にする。赤くするのは
          # 「知らせられなかった」ときだけに絞り、赤の意味を薄めない。
          set +e
          python check.py "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
            exit 0
          fi
          exit "$code"

      - name: 検算の記録をコミット
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ docs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo '記録の更新はありません'
          else
            git commit -m "検算結果を記録: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: ダッシュボードへ最新データを通知
        if: success()
        continue-on-error: true
        env:
          DASHBOARD_WEBHOOK_SECRET: ${{ secrets.KEIBA_DASHBOARD_IMPORT_SECRET }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 --max-time 120 \
            -X POST "https://keibadash-jaskieca.manus.space/api/integrations/github/import" \
            -H "Content-Type: application/json" \
            -H "x-github-import-secret: ${DASHBOARD_WEBHOOK_SECRET}" \
            -d '{"repo":"amanohara361/keiba","workflow":"jra-check","runId":"'"${GITHUB_RUN_ID_VALUE}"'","sha":"'"${GITHUB_SHA_VALUE}"'"}'
