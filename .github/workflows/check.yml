name: 直前検算

on:
  schedule:
    # cron は UTC 指定。日本時間は +9 時間。
    # 朝の買い目が届いているかの早期確認（届いていなければ警報メール）
    - cron: '0 2 * * 6'    # 土02:00 UTC = 土11:00 JST
    - cron: '0 2 * * 0'    # 日02:00 UTC = 日11:00 JST
    # 直前検算。重賞は15:25〜15:45発走が多いので余裕をみて14:30。
    - cron: '30 5 * * 6'   # 土05:30 UTC = 土14:30 JST
    - cron: '30 5 * * 0'   # 日05:30 UTC = 日14:30 JST
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 (YYYY-MM-DD)。空なら実行日。'
        required: false
      now:
        description: '現在時刻の上書き (YYYY-MM-DDTHH:MM)。動作確認用。'
        required: false
      no_email:
        description: 'メールを送らずログだけ出す'
        type: boolean
        default: false

concurrency:
  group: keiba-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 依存のインストールは不要（標準ライブラリだけで動く）。
      # インストール失敗で定刻を落とさないための設計でもある。

      - name: 検算を実行
        id: run
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_NOW: ${{ inputs.now }}
          INPUT_NO_EMAIL: ${{ inputs.no_email }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi
          if [ -n "$INPUT_NOW" ]; then
            args+=(--now "$INPUT_NOW")
          fi
          if [ "$INPUT_NO_EMAIL" = 'true' ]; then
            args+=(--no-email)
          fi
          # 終了コード3＝発注を止めた買い目あり。異常ではないのでジョブは成功にする。
          set +e
          python check.py "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
            exit 0
          fi
          exit "$code"

      - name: 検算の記録をコミット
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo '記録の更新はありません'
          else
            git commit -m "検算結果を記録: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
