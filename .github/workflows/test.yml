name: テスト

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存をインストール
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: テストを実行
        run: pytest -v
