name: 週末重賞の予想

on:
  schedule:
    # cron は UTC 指定。日本時間は +9 時間。
    # 朝（叩き台。馬体重・馬場はまだ出ていない）
    - cron: '0 23 * * 5'   # 金23:00 UTC = 土08:00 JST
    - cron: '0 23 * * 6'   # 土23:00 UTC = 日08:00 JST
    # 馬体重・馬場状態が出そろった頃の更新
    - cron: '0 2 * * 6'    # 土02:00 UTC = 土11:00 JST
    - cron: '0 2 * * 0'    # 日02:00 UTC = 日11:00 JST
    # 直前（最終オッズと直前の馬場変化を反映）
    - cron: '30 5 * * 6'   # 土05:30 UTC = 土14:30 JST
    - cron: '30 5 * * 0'   # 日05:30 UTC = 日14:30 JST
  workflow_dispatch:
    inputs:
      mode:
        description: '配信の種類'
        type: choice
        options: [morning, update, final]
        default: morning
      today:
        description: '基準日時 (YYYY-MM-DD または YYYY-MM-DDTHH:MM)。空なら実行日時。'
        required: false
      no_email:
        description: 'メールを送らずログだけ出す'
        type: boolean
        default: false

# 予想をコミットして戻すため、同時実行を1本に絞る
concurrency:
  group: keiba-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存をインストール
        run: pip install -r requirements.txt

      - name: 配信の種類を決める
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$SCHEDULE" in
            '0 23 * * 5'|'0 23 * * 6')  mode=morning ;;
            '0 2 * * 6'|'0 2 * * 0')    mode=update ;;
            '30 5 * * 6'|'30 5 * * 0')  mode=final ;;
            *)                          mode="${INPUT_MODE:-morning}" ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "配信の種類: $mode"

      - name: 予想を実行
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          # run: に直接埋め込まず環境変数経由で渡す
          MODE: ${{ steps.mode.outputs.mode }}
          INPUT_TODAY: ${{ inputs.today }}
          INPUT_NO_EMAIL: ${{ inputs.no_email }}
        run: |
          args=(--mode "$MODE")
          if [ -n "$INPUT_TODAY" ]; then
            args+=(--today "$INPUT_TODAY")
          fi
          if [ "$INPUT_NO_EMAIL" = 'true' ]; then
            args+=(--no-email)
          fi
          python main.py "${args[@]}"

      - name: 予想をコミット
        if: success()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo '保存すべき新しい予想はありません'
          else
            git commit -m "予想を更新: $(date -u +%Y-%m-%d) (${{ steps.mode.outputs.mode }})"
            # 答え合わせジョブが先にコミットしている場合に備えて取り込んでから push
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
