name: バイアス蓄積

# 当日のトラックバイアスを測り、data_jra/ に貯める。
#
# **2026-09-27 に当日経路（jra_bias.py live）へ切り替えた。** それまでの fetch は
# db.netkeiba.com を読むが、ここは当日中は個別レースを載せないため、21:00 に
# 回しても空振りしていた（このワークフローは一度もコミットできていなかった）。
# live は race.netkeiba.com の結果ページを読み、確定直後から測れる。
#
# 昼の便は「昼の見直し」（docs/昼の見直し手順.md）に当日の馬場とバイアスを渡すためのもの。
# 判定結果は data/bias/YYYY-MM-DD.txt に上書き保存する（見直しのセッションが読む）。
#
# CLAUDE.md にあるとおり、Claudeのサンドボックスは db.netkeiba.com に到達できず
# （403 Tunnel connection failed）、スポーツナビの結果ページを手で web_fetch して
# data_snav\ に保存する運用でしのいでいた。
# **GitHub Actions のランナーは netkeiba に到達できる**ため、この経路では
# fetch がそのまま使える。手動保存の運用は不要になる。
#
# 蓄積が増えるほどバイアス判定の精度が上がる（100レース程度で平常値が安定する）。
# 現在は「蓄積不足のため1.00を仮基準」の状態なので、まずここを埋める。

on:
  schedule:
    # 昼：11:37 JST = 02:37 UTC。午前の5〜6鞍で当日の傾向を測る。
    # 定時実行は最大85分遅れるので、昼の見直しのセッションは結果が古ければ
    # workflow_dispatch で起こし直す（手動起動は遅れない）。
    - cron: '37 2 * * 6,0'
    # 夜：開催終了後に全レースを蓄積する。21:00 JST = 12:00 UTC。
    - cron: '0 12 * * 6'
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 (YYYYMMDD)。空なら実行日。'
        required: false
      venue:
        description: '競馬場。空なら all（その日の開催全場）。'
        required: false

concurrency:
  group: keiba-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: レース結果を取得して蓄積
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_VENUE: ${{ inputs.venue }}
        run: |
          date_arg="${INPUT_DATE:-$(TZ=Asia/Tokyo date +%Y%m%d)}"
          venue_arg="${INPUT_VENUE:-all}"
          echo "対象: $date_arg $venue_arg"
          # レース間に1.5秒のウェイトが入る（jra_bias.py 側の配慮）
          python jra_bias.py live "$date_arg" "$venue_arg"

      - name: バイアスを判定して実行ログに残す
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_VENUE: ${{ inputs.venue }}
        run: |
          date_arg="${INPUT_DATE:-$(TZ=Asia/Tokyo date +%Y%m%d)}"
          venue_arg="${INPUT_VENUE:-all}"
          day="${date_arg:0:4}-${date_arg:4:2}-${date_arg:6:2}"
          mkdir -p data/bias
          {
            echo "# 測定時刻 $(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M:%S+09:00)"
            python jra_bias.py bias "$date_arg" "$venue_arg" || true
          } > "data/bias/$day.txt"
          { echo '```'; cat "data/bias/$day.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 蓄積をコミット
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_jra/ data/bias/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo '新しい蓄積はありません（開催なし、または取得できず）'
          else
            git commit -m "バイアスデータを蓄積: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
