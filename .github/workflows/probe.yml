name: ページ構造の調査

# 取得がおかしいときに、実際のページの中身を確認するための調査用。
# 推測で正規表現をいじる前に生のテキストを見る（jra_bias.py の probe と同じ考え方）。
#
# Claude のサンドボックスからは netkeiba に到達できないため、
# 調査もランナー側で行う必要がある。

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: '調べる対象。conditions/bias は race_id（12桁）、card-list は YYYY-MM-DD、card-entries/card-entries-raw は race_id、card-horse は horse_id、card-horse-search は馬名'
        required: true
      target:
        description: '調べる対象'
        type: choice
        options: [conditions, bias, result-raw, url-raw, comments, card-entries-all, card-list, card-entries, card-entries-raw, card-horse, card-horse-search, card-build]
        default: conditions

concurrency:
  group: keiba-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 調査を実行
        env:
          RACE_ID: ${{ inputs.race_id }}
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p data/probe
          {
            echo "# $TARGET $RACE_ID  ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            case "$TARGET" in
              bias)       python jra_bias.py probe "${RACE_ID:0:8}" all || true ;;
              result-raw) python -c "
          import re, sys, urllib.request
          url = 'https://race.netkeiba.com/race/result.html?race_id=' + sys.argv[1]
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          raw = urllib.request.urlopen(req, timeout=30).read()
          for enc in ('utf-8', 'euc_jp'):
              try:
                  page = raw.decode(enc); break
              except UnicodeDecodeError:
                  pass
          page = re.sub(r'(?s)<(script|style|noscript)[^>]*>.*?</\1>', '', page)
          page = re.sub(r'(?s)<!--.*?-->', '', page)
          page = re.sub(r'\n\s*\n+', '\n', page)
          i = page.find('RaceName')
          print(url, len(raw))
          print(page[max(0, i - 2000):max(0, i - 2000) + 60000])
          " "$RACE_ID" || true ;;
              # 保存済みカード（RACE_ID に YYYY-MM-DD）の重賞に陣営コメントを付けて表示する（保存はしない）。
              comments) python -c "
          import json, sys
          from datetime import date
          import card, comments
          day = date.fromisoformat(sys.argv[1])
          c = card.load_card(day) or {'races': []}
          races = [r for r in c['races'] if r.get('grade') in comments.GRADES]
          print('重賞', [(r['name'], r['grade'], len(r.get('entries') or [])) for r in races])
          comments.attach(races, day)
          for r in races:
              print(json.dumps({'name': r['name'], 'comments': r.get('comments')}, ensure_ascii=False, indent=1))
          " "$RACE_ID" 2>&1 || true ;;
              # 陣営コメントの取得先を探す調査用。RACE_ID に URL を渡す（許可したドメインだけ）。
              url-raw) python -c "
          import re, sys, urllib.request, urllib.parse
          allowed = ('keibalab.jp', 'netkeiba.com', 'jra.go.jp', 'sponichi.co.jp', 'nikkansports.com',
                     'daily.co.jp', 'sanspo.com', 'hochi.news', 'tospo-keiba.jp', 'umanity.jp', 'keibabook.co.jp')
          for url in sys.argv[1].split():
              print('=' * 20, url)
              host = urllib.parse.urlparse(url).hostname or ''
              if not url.startswith('https://') or not any(host == d or host.endswith('.' + d) for d in allowed):
                  print('許可していないURL'); continue
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  resp = urllib.request.urlopen(req, timeout=20)
                  raw = resp.read()
              except Exception as exc:
                  print('取得失敗:', repr(exc)); continue
              print('status', resp.status, 'final', resp.geturl(), 'bytes', len(raw))
              for enc in ('utf-8', 'euc_jp', 'cp932'):
                  try:
                      page = raw.decode(enc); break
                  except UnicodeDecodeError:
                      pass
              body_at = max(page.find('<body'), 0)
              for mark in ('▼', '/kiji/'):
                  k = page.find(mark, body_at)
                  if k >= 0:
                      print('--- raw around', mark, '---')
                      print(page[max(0, k - 1500):k + 6000])
              print('--- links ---')
              for href, body in re.findall(r'(?s)<a[^>]+href=[\\x27\\x22]([^\\x27\\x22]+)[^>]*>(.*?)</a>', page):
                  label = re.sub(r'\\s+', ' ', re.sub(r'<[^>]+>', ' ', body)).strip()
                  if re.search(r'kiji|comment|danwa|kaiken|interview|oikiri', href, re.I) and label:
                      print(href, '|', label[:80])
              page = re.sub(r'(?s)<(script|style|noscript)[^>]*>.*?</\\1>', '', page)
              text = re.sub(r'<[^>]+>', ' ', page)
              text = re.sub(r'[ \\t\\u3000]+', ' ', text)
              text = re.sub(r'\\n\\s*\\n+', '\\n', text)
              print('--- text ---')
              print(text[:15000])
          " "$RACE_ID" 2>&1 || true ;;
              card-list)  python card.py probe list "$RACE_ID" || true ;;
              # card.yml が既定ブランチに入るまでの通し確認用。RACE_ID に日付を渡す。
              card-build) python card.py build --date "$RACE_ID" --limit 2 || true ;;
              card-entries) python card.py probe entries "$RACE_ID" || true ;;
              card-entries-all) python -c "
          import json, sys, form
          for k, v in sorted(form.fetch_entries(sys.argv[1]).items()):
              print(k, json.dumps(v, ensure_ascii=False))
          " "$RACE_ID" || true ;;
              card-entries-raw) python card.py probe entries-raw "$RACE_ID" || true ;;
              card-horse) python card.py probe horse "$RACE_ID" || true ;;
              card-horse-search) python card.py probe horse-search "$RACE_ID" || true ;;
              *)          python conditions.py probe "$RACE_ID" || true ;;
            esac
          } | tee data/probe/last.txt
          { echo '```'; cat data/probe/last.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 調査結果をリポジトリに残す。実行ログのAPIから読むより、
      # git fetch して読むほうが確実で軽い（ログは巨大なJSONに包まれてくる）。
      #
      # 置き場所は専用ブランチ probe-results（毎回上書き。履歴は持たない）。
      # 以前は起動したブランチにコミットしていたが、そのブランチに PR が開いていると
      # 「github-actions[bot] pushed 1 commit」の通知が調査のたびに届き、
      # 調査結果のファイルが PR の差分にも混ざった（2026-10-01、PR #79・#80）。
      # 読むとき：git fetch origin probe-results && git show origin/probe-results:data/probe/last.txt
      - name: 調査結果を probe-results に置く
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ -f data/probe/last.txt ] || exit 0
          blob=$(git hash-object -w data/probe/last.txt)
          probe=$(printf '100644 blob %s\tlast.txt\n' "$blob" | git mktree)
          data=$(printf '040000 tree %s\tprobe\n' "$probe" | git mktree)
          root=$(printf '040000 tree %s\tdata\n' "$data" | git mktree)
          commit=$(git commit-tree "$root" -m "調査結果: ${TARGET} ${RACE_ID}（${GITHUB_REF_NAME} から）")
          git push -f origin "${commit}:refs/heads/probe-results"
        env:
          RACE_ID: ${{ inputs.race_id }}
          TARGET: ${{ inputs.target }}
