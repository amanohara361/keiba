name: ページ構造の調査

# 取得がおかしいときに、実際のページの中身を確認するための調査用。
# 推測で正規表現をいじる前に生のテキストを見る（jra_bias.py の probe と同じ考え方）。
#
# Claude のサンドボックスからは netkeiba に到達できないため、
# 調査もランナー側で行う必要がある。

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: '調べる対象。conditions/bias は race_id（12桁）、card-list は YYYY-MM-DD、card-entries は race_id、card-horse は horse_id'
        required: true
      target:
        description: '調べる対象'
        type: choice
        options: [conditions, bias, card-list, card-entries, card-horse, card-build]
        default: conditions

concurrency:
  group: keiba-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 調査を実行
        env:
          RACE_ID: ${{ inputs.race_id }}
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p data/probe
          {
            echo "# $TARGET $RACE_ID  ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            case "$TARGET" in
              bias)       python jra_bias.py probe "${RACE_ID:0:8}" all || true ;;
              card-list)  python card.py probe list "$RACE_ID" || true ;;
              # card.yml が既定ブランチに入るまでの通し確認用。RACE_ID に日付を渡す。
              card-build) python card.py build --date "$RACE_ID" --limit 2 || true ;;
              card-entries) python card.py probe entries "$RACE_ID" || true ;;
              card-horse) python card.py probe horse "$RACE_ID" || true ;;
              *)          python conditions.py probe "$RACE_ID" || true ;;
            esac
          } | tee data/probe/last.txt
          { echo '```'; cat data/probe/last.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 調査結果をリポジトリに残す。実行ログのAPIから読むより、
      # git pull して読むほうが確実で軽い（ログは巨大なJSONに包まれてくる）。
      - name: 調査結果をコミット
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/probe/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo '更新はありません'
          else
            git commit -m "調査結果: ${TARGET} ${RACE_ID}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
        env:
          RACE_ID: ${{ inputs.race_id }}
          TARGET: ${{ inputs.target }}
